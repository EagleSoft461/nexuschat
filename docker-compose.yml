version: '3.8'

services:
  app:
    build: .
    container_name: nexuschat-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nexuschat-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: nexuschat-postgres
    environment:
      POSTGRES_DB: nexuschat
      POSTGRES_USER: nexuschat
      POSTGRES_PASSWORD: nexuschat
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexuschat -d nexuschat"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexuschat-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: nexuschat-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexuschat-network
    restart: unless-stopped

    logging:
      level: { com.nexuschat: DEBUG, org.springframework.web.socket: DEBUG, org.springframework.messaging: DEBUG }

volumes:
  postgres_data:
  redis_data:

networks:
  nexuschat-network:
    driver: bridge
