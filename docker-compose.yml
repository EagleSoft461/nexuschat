services:
  app:
    build: .
    container_name: nexuschat-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/nexuschat
      - SPRING_DATASOURCE_USERNAME=nexuschat
      - SPRING_DATASOURCE_PASSWORD=nexuschat
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_STOMP_PORT=61613
      - RABBITMQ_USERNAME=nexuschat
      - RABBITMQ_PASSWORD=nexuschat
      - RABBITMQ_ENABLED=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - nexuschat-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    container_name: nexuschat-postgres
    environment:
      POSTGRES_DB: nexuschat
      POSTGRES_USER: nexuschat
      POSTGRES_PASSWORD: nexuschat
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexuschat -d nexuschat"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexuschat-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: nexuschat-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexuschat-network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: nexuschat-rabbitmq
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
      - "61613:61613"  # STOMP
    environment:
      RABBITMQ_DEFAULT_USER: nexuschat
      RABBITMQ_DEFAULT_PASS: nexuschat
    # Enable STOMP plugin on startup
    command: >
      sh -c "rabbitmq-plugins enable rabbitmq_stomp rabbitmq_web_stomp &&
             rabbitmq-server"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - nexuschat-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: nexuschat-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      - app
    networks:
      - nexuschat-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:

networks:
  nexuschat-network:
    driver: bridge
