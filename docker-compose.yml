services:
  app:
    build: .
    container_name: nexuschat-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/nexuschat
      - SPRING_DATASOURCE_USERNAME=nexuschat
      - SPRING_DATASOURCE_PASSWORD=nexuschat
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nexuschat-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    container_name: nexuschat-postgres
    environment:
      POSTGRES_DB: nexuschat
      POSTGRES_USER: nexuschat
      POSTGRES_PASSWORD: nexuschat
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexuschat -d nexuschat"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexuschat-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: nexuschat-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexuschat-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: nexuschat-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      - app
    networks:
      - nexuschat-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  prometheus_data:

networks:
  nexuschat-network:
    driver: bridge
