apiVersion: v1
kind: ConfigMap
metadata:
  name: nexuschat-config
  namespace: nexuschat
data:
  SPRING_PROFILES_ACTIVE: "docker"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-service:5432/nexuschat"
  SPRING_DATASOURCE_USERNAME: "nexuschat"
  SPRING_DATA_REDIS_HOST: "redis-service"
  SPRING_DATA_REDIS_PORT: "6379"
  SERVER_PORT: "8080"
  JWT_EXPIRATION: "86400000"
  JWT_REFRESH_EXPIRATION: "604800000"
  RABBITMQ_HOST: "rabbitmq-service"
  RABBITMQ_PORT: "5672"
  RABBITMQ_STOMP_PORT: "61613"
  RABBITMQ_USERNAME: "nexuschat"
  RABBITMQ_ENABLED: "true"
