apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexuschat-ingress
  namespace: nexuschat
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    # WebSocket support — required for STOMP/SockJS
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    # TLS — uncomment and configure for production
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  # tls:
  #   - hosts:
  #       - nexuschat.yourdomain.com
  #     secretName: nexuschat-tls
  rules:
    - host: nexuschat.yourdomain.com   # Replace with your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexuschat-service
                port:
                  number: 80
