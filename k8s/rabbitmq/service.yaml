apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-service
  namespace: nexuschat
  labels:
    app: rabbitmq
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: stomp
      port: 61613
      targetPort: 61613
    - name: management
      port: 15672
      targetPort: 15672
  type: ClusterIP
