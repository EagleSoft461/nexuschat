apiVersion: v1
kind: Secret
metadata:
  name: nexuschat-secret
  namespace: nexuschat
type: Opaque

# Development template only.
# Do not use these placeholder values in production.
# stringData values are plain text; Kubernetes encodes them internally.
stringData:
  SPRING_DATASOURCE_PASSWORD: "replace-with-local-db-password"
  JWT_SECRET: "replace-with-a-random-secret-at-least-32-characters-long"
  POSTGRES_PASSWORD: "replace-with-local-postgres-password"
  RABBITMQ_PASSWORD: "replace-with-local-rabbitmq-password"
