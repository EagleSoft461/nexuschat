apiVersion: v1
kind: Secret
metadata:
  name: nexuschat-secret
  namespace: nexuschat
type: Opaque
# Values are base64 encoded. To encode: echo -n 'value' | base64
# IMPORTANT: Replace these with strong secrets before deploying to production!
# JWT_SECRET: must be at least 32 characters (256 bits)
stringData:
  SPRING_DATASOURCE_PASSWORD: "nexuschat"
  JWT_SECRET: "nexuschat-super-secret-key-change-in-production-must-be-at-least-256-bits"
  POSTGRES_PASSWORD: "nexuschat"
  RABBITMQ_PASSWORD: "nexuschat"
