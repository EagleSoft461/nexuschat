spring:
  application:
    name: nexuschat

  datasource:
    url: jdbc:postgresql://localhost:5432/nexuschat?characterEncoding=UTF-8&useUnicode=true
    username: nexuschat
    password: nexuschat
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# WARNING: Change jwt.secret before deploying to production!
# Must be at least 256 bits (32 characters). Use environment variable JWT_SECRET in production.
jwt:
  secret: ${JWT_SECRET:nexuschat-super-secret-key-change-in-production-must-be-at-least-256-bits}
  expiration: ${JWT_EXPIRATION:86400000}          # 24 hours in milliseconds
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}  # 7 days in milliseconds

logging:
  level:
    com.nexuschat: DEBUG
    org.springframework.web.socket: INFO

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# Rate limiting (per user, per minute)
rate-limit:
  message:
    capacity: 30          # max burst
    refill-per-minute: 30 # tokens refilled per minute
  auth:
    capacity: 10
    refill-per-minute: 10
