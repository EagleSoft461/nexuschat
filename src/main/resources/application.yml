spring:
  application:
    name: nexuschat

  datasource:
    url: jdbc:postgresql://localhost:5432/nexuschat?characterEncoding=UTF-8&useUnicode=true
    username: nexuschat
    password: nexuschat
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:nexuschat}
    password: ${RABBITMQ_PASSWORD:nexuschat}
    virtual-host: /

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# WARNING: Change jwt.secret before deploying to production!
jwt:
  secret: ${JWT_SECRET:nexuschat-super-secret-key-change-in-production-must-be-at-least-256-bits}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

logging:
  level:
    com.nexuschat: DEBUG
    org.springframework.web.socket: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

rate-limit:
  message:
    capacity: 30
    refill-per-minute: 30
  auth:
    capacity: 10
    refill-per-minute: 10
  websocket:
    capacity: 60
    refill-per-minute: 60

rabbitmq:
  host: ${RABBITMQ_HOST:localhost}
  port: ${RABBITMQ_PORT:5672}
  stomp-port: ${RABBITMQ_STOMP_PORT:61613}
  username: ${RABBITMQ_USERNAME:nexuschat}
  password: ${RABBITMQ_PASSWORD:nexuschat}
  enabled: ${RABBITMQ_ENABLED:false}
