spring:
  application:
    name: nexuschat

  datasource:
    url: jdbc:postgresql://localhost:5432/nexuschat
    username: nexuschat
    password: nexuschat
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

server:
  port: 8080

jwt:
  secret: nexuschat-super-secret-key-change-in-production-must-be-at-least-256-bits
  expiration: 86400000  # 24 hours in milliseconds

logging:
  level:
    com.nexuschat: DEBUG
    org.springframework.web.socket: INFO
