# Test environment configuration

# Application
spring.application.name=nexuschat-test

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nexuschat_test}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:nexuschat}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:nexuschat}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway - disable for tests (use JPA create-drop instead)
spring.flyway.enabled=false

# Redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# RabbitMQ - disable for tests
rabbitmq.enabled=false

# JWT
jwt.secret=test-secret-key-for-testing-only-minimum-256-bits-required-here
jwt.expiration=3600000
jwt.refresh-expiration=86400000

# Logging
logging.level.root=WARN
logging.level.com.nexuschat=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN

# Disable banner
spring.main.banner-mode=off

# Actuator
management.endpoints.enabled-by-default=false
